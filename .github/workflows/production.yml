name: Production CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: production-ci
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Notify Vercel
        uses: vercel/repository-dispatch/actions/status@v1
        with:
          name: "Vercel - auckland-bargain: ci"

      - name: Verify migration secrets
        shell: bash
        run: |
          missing=0
          for name in \
            SUPABASE_ACCESS_TOKEN \
            SUPABASE_DB_PASSWORD \
            SUPABASE_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Production environment secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Reject HTTP migration routes
        run: |
          if find app/api -type f -path '*/apply-migration/route.*' -print -quit | grep -q .; then
            echo "Database migrations must not be exposed through an HTTP route."
            exit 1
          fi

      - name: Run tests
        run: npm test

      - name: Run type checking
        run: npm run typecheck

      - name: Run lint
        run: npm run lint

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      - name: Link production database
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Show migration history
        run: supabase migration list

      - name: Apply production migrations
        run: supabase db push

      - name: Verify no migrations remain pending
        run: supabase db push --dry-run
